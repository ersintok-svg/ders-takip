<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Özel Ders Takip</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ders Takip">
<link rel="apple-touch-icon" href="icon-192.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6f9;--card:#fff;--primary:#4f46e5;--primary-hover:#4338ca;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px}
.container{max-width:960px;margin:0 auto}
h1{font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:20px}
h1 small{font-size:.85rem;font-weight:400;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--card);border-radius:var(--radius);padding:4px;box-shadow:var(--shadow)}
.tab{padding:10px 20px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:500;color:var(--muted);transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--primary);color:#fff}
.panel{display:none}
.panel.active{display:block}
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.875rem;font-weight:500;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--bg)}
.btn-sm{padding:4px 10px;font-size:.8rem}
.calendar-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;padding:16px}
.cal-grid{display:flex;flex-direction:column;gap:8px}
.cal-day{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.cal-day.day-0{border-left:4px solid #3b82f6}
.cal-day.day-0 .cal-day-header{background:#eff6ff}
.cal-day.day-0 .cal-day-header .cal-date{color:#3b82f6}
.cal-day.day-1{border-left:4px solid #8b5cf6}
.cal-day.day-1 .cal-day-header{background:#f5f3ff}
.cal-day.day-1 .cal-day-header .cal-date{color:#8b5cf6}
.cal-day.day-2{border-left:4px solid #14b8a6}
.cal-day.day-2 .cal-day-header{background:#f0fdfa}
.cal-day.day-2 .cal-day-header .cal-date{color:#14b8a6}
.cal-day.day-3{border-left:4px solid #f97316}
.cal-day.day-3 .cal-day-header{background:#fff7ed}
.cal-day.day-3 .cal-day-header .cal-date{color:#f97316}
.cal-day.day-4{border-left:4px solid #ec4899}
.cal-day.day-4 .cal-day-header{background:#fdf2f8}
.cal-day.day-4 .cal-day-header .cal-date{color:#ec4899}
.cal-day.day-5{border-left:4px solid #22c55e}
.cal-day.day-5 .cal-day-header{background:#f0fdf4}
.cal-day.day-5 .cal-day-header .cal-date{color:#22c55e}
.cal-day.day-6{border-left:4px solid #ef4444}
.cal-day.day-6 .cal-day-header{background:#fef2f2}
.cal-day.day-6 .cal-day-header .cal-date{color:#ef4444}
.cal-day.today{border-color:var(--primary);border-width:2px}
.cal-day-header{padding:10px 14px;font-weight:600;font-size:.9rem;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.cal-day.today .cal-day-header{background:var(--primary);color:#fff}
.cal-day-header .cal-date{font-size:.8rem;font-weight:400;color:var(--muted)}
.cal-day.today .cal-day-header .cal-date{color:rgba(255,255,255,.8)}
.cal-boxes{padding:6px 10px}
.cal-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.cal-row:last-child{border-bottom:none}
.cal-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:var(--primary)}
.cal-row .row-name{flex:1;border:none;outline:none;font-size:.85rem;padding:4px 6px;background:transparent;font-family:inherit;color:var(--text);min-width:0}
.cal-row .row-name:focus{background:#f0f0ff;border-radius:4px}
.cal-row .row-time{width:92px;border:none;outline:none;font-size:.8rem;padding:4px 6px;background:transparent;font-family:inherit;color:var(--muted);text-align:right;flex-shrink:0}
.cal-row .row-time:focus{background:#f0f0ff;border-radius:4px}
.cal-row .row-amount{width:74px;border:none;outline:none;font-size:.8rem;padding:4px 6px;background:transparent;font-family:inherit;color:var(--text);text-align:right;flex-shrink:0}
.cal-row .row-amount:focus{background:#f0f0ff;border-radius:4px}
.cal-row.done{opacity:.45}
.cal-row.missed{background:#fef2f2}
.cal-row.missed .row-name{color:#dc2626;font-weight:600}
.missed-btn{padding:3px 8px;font-size:.7rem;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);cursor:pointer;flex-shrink:0;transition:.2s}
.missed-btn.on{background:#dc2626;border-color:#dc2626;color:#fff;font-weight:600}
.cal-add{display:block;width:100%;padding:8px;border:1px dashed var(--border);border-radius:6px;background:transparent;color:var(--muted);font-size:.8rem;cursor:pointer;text-align:center;transition:.2s}
.cal-add:hover{background:var(--bg);color:var(--primary);border-color:var(--primary)}
.delete-row{width:18px;height:18px;border:none;background:transparent;color:#ccc;cursor:pointer;font-size:.9rem;padding:0;line-height:1;flex-shrink:0;opacity:0;transition:.2s}
.cal-row:hover .delete-row{opacity:1}
.delete-row:hover{color:var(--danger)}
.student-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.student-card h3{font-size:1rem;margin-bottom:4px}
.student-card .summary{font-size:.85rem;color:var(--muted);margin-bottom:10px}
.student-card table{width:100%;border-collapse:collapse;font-size:.85rem}
.student-card th,.student-card td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.student-card th{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.student-card .paid-badge{color:#059669;font-weight:600}
.student-card .unpaid-badge{color:#dc2626;font-weight:600}
.student-card .tutar{text-align:right;font-weight:600;white-space:nowrap}
.student-card .toplam{background:#f8fafc;font-weight:700}
.student-card .toplam td{border-bottom:none;padding-top:10px}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted)}
.empty-state p{margin-bottom:12px;font-size:1rem}
@media print{body{background:#fff;padding:0}.tabs,.toolbar,.cal-add,.delete-row{display:none!important}.panel{display:block!important}.container{max-width:100%}.student-card{break-inside:avoid;box-shadow:none;border:1px solid #ddd;border-radius:4px}}
@media(max-width:600px){body{padding:8px}.cal-row{flex-wrap:wrap;gap:3px;padding:6px 0}.cal-row .row-name{flex:1;min-width:80px;font-size:.9rem;padding:4px 2px}.cal-row .row-time{flex:1;min-width:80px;font-size:.85rem;padding:4px 2px}.cal-row .row-amount{flex:1;min-width:70px;font-size:.85rem;padding:4px 2px}.cal-boxes{padding:4px 6px}.cal-add{font-size:.75rem;padding:6px}.cal-day-header{padding:8px 10px;font-size:.85rem}.student-card table{font-size:.8rem}.student-card th,.student-card td{padding:6px}}
</style>
</head>
<body>
<div class="container">
<h1>&#x1F393; Özel Ders Takip <small>program &amp; ödeme</small></h1>

<div id="profile-bar" style="display:flex;gap:8px;align-items:center;margin-bottom:16px"></div>

<div class="tabs">
  <button class="tab active" data-tab="program">&#x1F4C5; Ders Programı</button>
  <button class="tab" data-tab="odemeler">&#x1F4B0; Ödemeler</button>
</div>

<div id="program" class="panel active">
  <div class="toolbar">
    <button class="btn btn-outline btn-sm" onclick="weekOffset--;renderSchedule()">&larr;</button>
    <span id="week-label" style="font-weight:600;min-width:240px;text-align:center;display:inline-block"></span>
    <button class="btn btn-outline btn-sm" onclick="copyWeekForward();weekOffset++;renderSchedule()">&rarr;</button>
    <button class="btn btn-outline btn-sm" onclick="weekOffset=0;renderSchedule()">Bu Hafta</button>
  </div>
  <div class="toolbar" style="margin-top:8px">
    <span style="font-size:.8rem;color:var(--muted)">Genel ders ücreti:</span>
    <input id="default-rate-bireysel" type="number" value="500" min="0" style="width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:.85rem;outline:none" onchange="localStorage.setItem(rateKeyB(),this.value);pushSettings()">
    <span style="font-size:.8rem;color:var(--muted)">TL/saat</span>
    <span style="font-size:.75rem;color:var(--muted);flex-basis:100%">Her dersin yanına saat ve ücreti yaz; sonraki haftalara aynen kopyalanır. Ücret boş kalırsa bu genel ücret (saat x TL) uygulanır.</span>
  </div>
  <div class="toolbar" style="margin-top:8px">
    <button class="btn btn-outline btn-sm" onclick="exportBackup()">&#128190; Yedek Al</button>
    <button class="btn btn-outline btn-sm" onclick="showRestoreModal()">&#128214; Geri Yükle</button>
    <button class="btn btn-outline btn-sm" onclick="auditData()">&#128269; Denetle</button>
  </div>
  <div class="calendar-wrap">
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<div id="odemeler" class="panel">
  <div class="toolbar" id="payments-list-toolbar">
    <button class="btn btn-primary btn-sm" onclick="printSelected()">&#x1F5A8; Seçili Öğrencileri PDF Gönder</button>
    <button class="btn btn-outline btn-sm" onclick="document.querySelectorAll('.student-select').forEach(function(c){c.checked=true});renderPayments()">Tümünü Seç</button>
    <label style="display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)">Ay: <select id="month-filter" onchange="paymentMonth=this.value;renderPayments()" style="border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:.85rem;outline:none;background:transparent;color:var(--text)"></select></label>
    <button class="btn btn-outline btn-sm" onclick="paymentMonth='';renderMonthOptions();renderPayments()">&#x1F4C6; Tümü</button>
    <button class="btn btn-outline btn-sm" onclick="renderPayments()">&#x21BB; Yenile</button>
  </div>
  <div class="toolbar" id="payments-detail-toolbar" style="display:none">
    <button class="btn btn-outline btn-sm" onclick="backToList()">&larr; Listeye Dön</button>
    <span id="detail-name" style="font-weight:700;min-width:120px"></span>
    <button class="btn btn-primary btn-sm" onclick="printPayments([currentStudent])">&#x1F5A8; PDF</button>
    <button class="btn btn-outline btn-sm" onclick="payAll(currentStudent)">Tümünü Ödendi Yap</button>
  </div>
  <div id="payments-content"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
var APP_VERSION='2026-08-06-14';
try{if(localStorage.getItem('appver')&&localStorage.getItem('appver')!==APP_VERSION){localStorage.setItem('appver',APP_VERSION);location.reload()}localStorage.setItem('appver',APP_VERSION)}catch(e){}
const DAYS = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
var weekOffset=0;
var paymentMonth='';
var profile=localStorage.getItem('dersProfile')||'ben';
function setProfile(p){localStorage.setItem('dersProfile',p);location.reload()}
function progKey(){return'dersTakipProgram_'+profile}
function payKey(){return'dersTakipOdeme_'+profile}
function rateKeyB(){return'dersDefaultRateBireysel_'+profile}
function rateKeyG(){return'dersDefaultRateGrup_'+profile}
function rateKeyOB(){return'dersDefaultRateOnlineBireysel_'+profile}
function rateKeyOG(){return'dersDefaultRateOnlineGrup_'+profile}

/* ---------- TAB ---------- */
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active')});
    this.classList.add('active');
    document.getElementById(this.dataset.tab).classList.add('active');
    if(this.dataset.tab==='odemeler') renderPayments();
  });
});

/* ---------- PROGRAM ---------- */
function renderSchedule(){
  var now=new Date(),start=new Date(now);
  start.setDate(start.getDate()+weekOffset*7-start.getDay()+1);
  var days=[];
  for(var i=0;i<7;i++){var d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}
  var isCW=(weekOffset===0),ti=-1;
  if(isCW) ti=now.getDay()===0?6:now.getDay()-1;
  var ms=days[0].toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
  if(days[0].getMonth()!==days[6].getMonth()) ms=days[0].toLocaleDateString('tr-TR',{month:'long'})+' - '+days[6].toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
  document.getElementById('week-label').textContent=ms+' | '+days[0].getDate()+' - '+days[6].getDate();
  var html='';
  days.forEach(function(d,idx){
    var di=d.getDay()===0?6:d.getDay()-1,isT=isCW&&idx===ti,dk=getDayKey(weekOffset,idx),rows=getDayData(dk);
    html+='<div class="cal-day day-'+idx+(isT?' today':'')+'"><div class="cal-day-header">'+DAYS[di]+'<span class="cal-date">'+d.getDate()+'</span></div><div class="cal-boxes" id="boxes-'+dk+'">';
    rows.forEach(function(r,ri){html+=renderRow(dk,ri,r)});
    html+='</div><button class="cal-add" onclick="addRow(\''+dk+'\')">+ Ekle</button></div>';
  });
  document.getElementById('cal-grid').innerHTML=html;
}

function renderRow(dk,idx,row){
  var ch=row.done?'checked':'',cls=row.done?' done':'',mcls=row.missed?' missed':'';
  var tp=parseTimePair(row.time||'');
  return '<div class="cal-row'+cls+mcls+'" data-key="'+dk+'" data-idx="'+idx+'">'+
    '<input type="checkbox" '+ch+' onchange="toggleRow(this)">'+
    '<input class="row-name" value="'+esc(row.name||'')+'" placeholder="Öğrenci adı" oninput="saveRow(this)">'+
    '<input class="row-time row-time-start" type="time" value="'+tp[0]+'" title="Başlangıç saati" oninput="saveRow(this)">'+
    '<span style="color:var(--muted);font-size:.85rem;flex-shrink:0">-</span>'+
    '<input class="row-time row-time-end" type="time" value="'+tp[1]+'" title="Bitiş saati" oninput="saveRow(this)">'+
    '<input class="row-amount" type="number" min="0" step="1" value="'+(row.amount>0?row.amount:'')+'" placeholder="Ücret" title="Ders ücreti (boş kalırsa genel ücret uygulanır)" oninput="saveRow(this)">'+
    '<button class="missed-btn'+(row.missed?' on':'')+'" onclick="toggleMissed(this)" title="Derse gelmedi">Gelmedi</button>'+
    '<button onclick="deleteRow(this)" style="width:18px;height:18px;border:none;background:transparent;color:#ccc;cursor:pointer;font-size:.9rem;padding:0;line-height:1;flex-shrink:0">x</button></div>';
}

function getRow(el){var r=el.parentElement;while(r&&!r.dataset.key)r=r.parentElement;return r?{key:r.dataset.key,idx:parseInt(r.dataset.idx),row:r}:null}
function addRow(dk){
  var rows=getDayData(dk);rows.push({name:'',time:'',done:false,missed:false,type:'bireysel'});
  saveDayRows(dk,rows);
  var c=document.getElementById('boxes-'+dk);
  c.insertAdjacentHTML('beforeend',renderRow(dk,rows.length-1,{name:'',time:'',done:false,missed:false,type:'bireysel'}));
  var inp=c.querySelectorAll('.row-name');if(inp.length)inp[inp.length-1].focus();
}
function deleteRow(el){
  var g=getRow(el);if(!g)return;
  var rows=getDayData(g.key);
  if(rows[g.idx]&&rows[g.idx].done) removePayment(g.key+'-'+g.idx);
  rows.splice(g.idx,1);saveDayRows(g.key,rows);renderSchedule();
}
function toggleRow(cb){
  try{
    if(cb.checked&&weekOffset>0){cb.checked=false;alert('Gelecek hafta dersleri işaretlenemez.');return}
    var g=getRow(cb);if(!g)return;
    var rows=getDayData(g.key);if(!rows[g.idx])return;
    rows[g.idx].done=cb.checked;
    if(cb.checked)rows[g.idx].missed=false;
    g.row.classList.toggle('done',cb.checked);
    g.row.classList.toggle('missed',!!rows[g.idx].missed);
    var mb=g.row.querySelector('.missed-btn');if(mb)mb.classList.toggle('on',!!rows[g.idx].missed);
    var key=g.key+'-'+g.idx;
    if(cb.checked){
      var r=rows[g.idx],name=r.name||'İsimsiz',time=r.time||'',t=r.type||'bireysel';
      addPayment(key,name,g.key,time,getRowAmount(r),t);
    }else{removePayment(key)}
    saveDayRows(g.key,rows);
  }catch(e){alert('Hata: '+e.message)}
}
function toggleMissed(el){
  try{
    if(weekOffset>0){alert('Gelecek hafta dersleri işaretlenemez.');return}
    var g=getRow(el);if(!g)return;
    var rows=getDayData(g.key);if(!rows[g.idx])return;
    rows[g.idx].missed=!rows[g.idx].missed;
    if(rows[g.idx].missed&&rows[g.idx].done){
      rows[g.idx].done=false;
      removePayment(g.key+'-'+g.idx);
    }
    g.row.classList.toggle('missed',!!rows[g.idx].missed);
    g.row.classList.toggle('done',!!rows[g.idx].done);
    var cb=g.row.querySelector('input[type=checkbox]');if(cb)cb.checked=!!rows[g.idx].done;
    var mb=g.row.querySelector('.missed-btn');if(mb)mb.classList.toggle('on',!!rows[g.idx].missed);
    saveDayRows(g.key,rows);
  }catch(e){alert('Hata: '+e.message)}
}
function saveRow(el){
  var g=getRow(el);if(!g)return;
  var rows=getDayData(g.key);if(!rows[g.idx])return;
  var row=rows[g.idx];
  row.name=g.row.querySelector('.row-name').value;
  var ts=g.row.querySelector('.row-time-start'),te=g.row.querySelector('.row-time-end');
  var t1=ts?ts.value:'',t2=te?te.value:'';
  row.time=(t1||t2)?t1+'-'+t2:'';
  var sel=g.row.querySelector('select');
  if(sel)row.type=sel.value;
  else if(!row.type)row.type='bireysel';
  var am=g.row.querySelector('.row-amount');var av=am?parseFloat(am.value):null;
  row.amount=av>0?av:null;
  saveDayRows(g.key,rows);
  if(row.done)updatePaymentAmount(g.key+'-'+g.idx,row.name,row.time,getRowAmount(row),row.type);
}

/* ---------- COPY WEEK ---------- */
function copyWeekForward(){
  var data;
  try{data=JSON.parse(localStorage.getItem(progKey())||'{}')}catch(e){return}
  var i,srcKey,dstKey,srcRows,dstRows,hasSrc=false,hasDst=false;
  for(i=0;i<7;i++){
    srcKey=getDayKey(weekOffset,i);dstKey=getDayKey(weekOffset+1,i);
    srcRows=data[srcKey];dstRows=data[dstKey];
    if(srcRows&&srcRows.length){for(var j=0;j<srcRows.length;j++)if(srcRows[j]&&(srcRows[j].name||srcRows[j].time)){hasSrc=true;break}}
    if(dstRows&&dstRows.length){for(var k=0;k<dstRows.length;k++)if(dstRows[k]&&(dstRows[k].name||dstRows[k].time)){hasDst=true;break}}
  }
  if(!hasSrc)return;
  if(hasDst&&!confirm('Hedef haftada dersler var. Kopyalama üzerine yazacak. Devam edilsin mi?'))return;
  for(i=0;i<7;i++){
    srcKey=getDayKey(weekOffset,i);dstKey=getDayKey(weekOffset+1,i);
    srcRows=data[srcKey];
    if(srcRows&&srcRows.length){
      var copy=srcRows.map(function(r){return{name:r.name,time:r.time,amount:r.amount,type:r.type||'bireysel',done:false,missed:false}});
      data[dstKey]=copy;
    }
  }
  localStorage.setItem(progKey(),JSON.stringify(data));
  pushProgram();
}

/* ---------- DATA ---------- */
function getDayKey(w,d){return'wk'+w+'d'+d}
function getDayData(k){try{var a=JSON.parse(localStorage.getItem(progKey())||'{}');return a[k]||[]}catch(e){return[]}}
function saveDayRows(k,r){try{var a=JSON.parse(localStorage.getItem(progKey())||'{}');a[k]=r;localStorage.setItem(progKey(),JSON.stringify(a));pushProgram()}catch(e){}}
function getDefaultRate(type){
  var v=parseFloat(localStorage.getItem(type==='onlineBireysel'?rateKeyOB():type==='onlineGrup'?rateKeyOG():type==='grup'?rateKeyG():rateKeyB()));
  return v>0?v:(type==='onlineBireysel'?2200:type==='onlineGrup'?1125:type==='grup'?300:500);
}
function getRowAmount(row){
  if(row&&row.amount>0)return row.amount;
  if(row&&row.rate>0)return row.rate;
  var t=row&&row.type?row.type:'bireysel';
  return lessonHours(t,row&&row.time?row.time:'')*getDefaultRate(t);
}

/* ---------- FIREBASE SYNC ---------- */

function calcHours(t){
  if(!t)return 0;
  var p=t.replace(/\./g,':').split('-');if(p.length<2)return 0;
  var s=p[0].trim().split(':').map(Number),e=p[1].trim().split(':').map(Number);
  if(s.length<2||e.length<2||isNaN(s[0])||isNaN(e[0]))return 0;
  var h=(e[0]*60+(e[1]||0)-s[0]*60-(s[1]||0))/60;return h>0?+h.toFixed(2):0;
}
var ONLINE_HOURS=1.5;
function lessonHours(type,time){
  if(type==='onlineBireysel'||type==='onlineGrup')return 1;
  return calcHours(time)||1;
}
function normalizeTime(v){
  if(!v)return'';
  var p=v.replace(/\./g,':').split(':');
  var h=p[0]?p[0].trim():'',m=p[1]?p[1].trim():'';
  if(!/^\d{1,2}$/.test(h))return'';
  if(m&&!/^\d{1,2}$/.test(m))m='';
  return('0'+(+h)).slice(-2)+':'+(m?('0'+(+m)).slice(-2):'00');
}
function parseTimePair(t){
  if(!t)return['',''];
  var p=t.split('-');
  return[normalizeTime(p[0]),normalizeTime(p[1])];
}

function getDateFromDayKey(dayKey){
  var m=dayKey.match(/wk(-?\d+)d(\d)/);if(!m)return'';
  var w=parseInt(m[1]),d=parseInt(m[2]),now=new Date(),start=new Date(now);
  start.setDate(start.getDate()+w*7-start.getDay()+1+d);
  var y=start.getFullYear(),mo=String(start.getMonth()+1).padStart(2,'0'),da=String(start.getDate()).padStart(2,'0');
  return y+'-'+mo+'-'+da;
}

  if(!iso)return'';

  var days=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  return days[d.getDay()]+' '+d.getDate()+' '+['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'][d.getMonth()]+' '+d.getFullYear();
}

function applyBackup(d){
  for(var k in d){if(d.hasOwnProperty(k))localStorage.setItem(k,d[k]);}
  alert('Veriler geri yüklendi.');
  location.reload();
}
function importBackup(input){
  var f=input.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var d=JSON.parse(reader.result);
      if(!d||typeof d!=='object')throw 0;
      applyBackup(d);
    }catch(e){alert('Geçersiz yedek dosyası.');input.value=''}
  };
  reader.readAsText(f);
}

function auditData(){
  var lines=[];
  var data;
  try{data=JSON.parse(localStorage.getItem(progKey())||'{}')}catch(e){data={}}
  var pay=getPayments(),payKeys=Object.keys(pay);
  var dayKeys=Object.keys(data);
  dayKeys.forEach(function(dk){
    var rows=data[dk]||[];
    rows.forEach(function(r,ri){
      if(r&&r.done){
        var key=dk+'-'+ri;
        lines.push((r.name||'İsimsiz')+'  ['+dk+' '+ (r.time||'-')+']  => işaretli'+(pay[key]?'  (ödeme var)':'  (!!! ödeme YOK)'));
      }
      if(r&&r.missed){
        lines.push((r.name||'İsimsiz')+'  ['+dk+' '+ (r.time||'-')+']  => GELMEDİ');
      }
    });
  });
  payKeys.forEach(function(k){
    var m=k.match(/^(wk-?\d+d\d)-(\d+)$/);
    if(m){
      var rows=data[m[1]],r=rows&&rows[parseInt(m[2])];
      if(!r)lines.push('!!! Ödeme var ama programda satır YOK: '+k+'  ('+(pay[k].name||'')+')');
    }
  });
  var msg=lines.length?lines.join('\n'):'İşaretli satır bulunamadı. Veri tutarlı görünüyor.';
  var m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px';
  m.innerHTML='<div style="background:#fff;border-radius:12px;max-width:600px;width:100%;padding:16px;box-sizing:border-box"><h3 style="margin-bottom:8px">Veri Denetimi</h3><p style="font-size:.8rem;color:#64748b;margin-bottom:8px">İşaretli satırlar ve program-ödeme eşleşmeleri:</p><div style="max-height:300px;overflow:auto;white-space:pre-wrap;font-family:monospace;font-size:.75rem;border:1px solid #e2e8f0;border-radius:8px;padding:8px;box-sizing:border-box">'+esc(msg)+'</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-outline btn-sm" onclick="this.parentElement.parentElement.parentElement.remove()">Kapat</button></div></div>';
  document.body.appendChild(m);
}

function checkBackup(){
  var last=localStorage.getItem('dersLastBackup');if(!last)return;
  var days=Math.floor((Date.now()-new Date(last).getTime())/86400000);
  if(days>=30){
    var b=document.createElement('div');
    b.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:998;background:#1e293b;color:#fff;border-radius:10px;padding:12px 16px;font-size:.85rem;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;gap:12px;max-width:90%';
    b.innerHTML='<span>&#9200; Son yedek '+days+' gün önce. Verilerini korumak için <strong>Yedek Al</strong>.</span><button style="border:none;background:#4f46e5;color:#fff;border-radius:6px;padding:6px 12px;font-size:.8rem;cursor:pointer" onclick="exportBackup();this.parentElement.remove()">Yedek Al</button><button style="border:none;background:transparent;color:#94a3b8;font-size:1rem;cursor:pointer" onclick="this.parentElement.remove()">&times;</button>';
    document.body.appendChild(b);
  }
}

function renderProfileBar(){

  });
  html+='<span style="font-size:.8rem;color:var(--muted)">Aktif: <strong style="color:'+profs[profile].color+'">'+profs[profile].label+'</strong></span>';

}
